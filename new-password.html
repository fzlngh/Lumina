<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Login</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .back-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 24px;
      cursor: pointer;
      text-decoration: none;
      color: black;
    }

    .back-btn img {
        width: 30px;
        height: 30px;
    }

    .logo {
      display: flex;
      align-items: center;
      margin-top: 60px;
      margin-bottom: 40px;
    }

    .logo img {
      width: 300px;
      height: 100px;
      margin-right: 10px;
      margin-left: 8rem;
      margin-top: 100px;
    }

    .form-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .form-container label {
      font-size: 16px;
      margin-bottom: 8px;
      text-align: left;
      width: 100%;
    }

    .form-container input {
      width: 220px;
      padding: 8px;
      font-size: 16px;
      border: 1px solid #aaa;
      border-radius: 3px;
      margin-bottom: 20px;
    }

    .form-container button {
      width: 240px;
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
      background: #ffc107;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .form-container button:hover {
      background: #ffb800;
    }
  </style>
</head>
<body>

  <!-- Tombol Back -->
  <a href="#" class="back-btn"><img src="./img/ep_back.png" alt="back"></a>

  <!-- Logo dan Nama -->
  <div class="logo">
    <img src="./img/Logo.png" alt="Logo Lumina">
  </div>

  <!-- Form Login -->
  <div class="form-container">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="">
    <button type="submit">Enter</button>
  </div>

</body>
</html>
