<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face Recognition Registration</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #f8f9fa;
      }

      .container {
        background: #fff;
        padding: 2rem;
        border-radius: 14px;
        box-shadow: 0 4px 12px rgb(255, 160, 18);
        width: 90%;
        max-width: 700px; /* diperkecil */
      }

      h2 {
        text-align: center;
        margin-bottom: 1.5rem;
        font-weight: normal;
        font-size: 1.3rem;
      }

      .content {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 2rem;
      }

      .photo {
        flex: 1;
        display: flex;
        justify-content: center;
      }

      .photo img {
        width: 100%;
        max-width: 260px; /* skala foto menyesuaikan container */
        border-radius: 10px;
      }

      .form {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        width: 100%;
      }

      .form-group label {
        font-size: 0.95rem;
        margin-bottom: 0.4rem;
        color: #333;
      }

      .form-group input {
        width: 100%;
        padding: 0.8rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 0.95rem;
        background: #fff5e6;
      }

      .btn {
        display: block;
        margin: 2rem auto 0 auto;
        width: 200px;
        padding: 0.9rem;
        background: #f8a602;
        color: white;
        font-size: 1rem;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s ease;
        text-align: center;
      }

      .btn:hover {
        background: #e08f00;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Face recognition registration</h2>
      <div class="content">
        <div class="photo">
          <img src="./img/kak-kenji.jpg" alt="User photo" />
        </div>
        <div class="form">
          <div class="form-group">
            <label>Name</label>
            <input type="text" value="Kenzie" readonly />
          </div>
          <div class="form-group">
            <label>Email address</label>
            <input type="text" value="kenji@gmail.com" readonly />
          </div>
          <div class="form-group">
            <label>Gender</label>
            <input type="text" value="Male" readonly />
          </div>
        </div>
      </div>
      <button class="btn" id="finishBtn">Finish</button>
    </div>

    <script>
      document.getElementById("finishBtn").addEventListener("click", function () {
        window.location.href = "./home.html";
      });
    </script>
  </body>
</html>
