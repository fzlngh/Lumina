<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f8f9fa;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .card {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 12px rgb(255, 160, 18);
        width: 100%;
        max-width: 400px;
      }

      .card h2 {
        text-align: center;
        margin-bottom: 1.5rem;
        color: #212529;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 1rem;
      }

      .form-group label {
        font-size: 0.95rem;
        margin-bottom: 0.5rem;
        color: #495057;
      }

      .form-group input {
        padding: 0.75rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s;
      }

      .form-group input:focus {
        border: 2px solid #f8b602;
      }

      .btn {
        width: 100%;
        padding: 0.9rem;
        background: #f8b602;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        color: white;
        cursor: pointer;
        transition: background 0.3s ease;
      }

      .btn:hover {
        background: #e6a400;
      }

      .note {
        margin-top: 1rem;
        text-align: center;
        font-size: 0.85rem;
        color: #868e96;
      }

      .error {
        color: red;
        font-size: 0.85rem;
        margin-top: 0.5rem;
        margin-bottom: 0.5rem;
        margin-left: 5px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Set New Password</h2>
      <form id="resetForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            required
          />
          <div class="error" id="passwordError">
            Password must contain uppercase, lowercase, number, and symbol.
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            required
          />
          <div class="error" id="confirmError">Passwords do not match.</div>
        </div>

        <button type="submit" class="btn">Create Password</button>
      </form>
      <p class="note">Make sure both passwords match and follow the rules.</p>
    </div>

    <script>
      const form = document.getElementById("resetForm");
      const newPassword = document.getElementById("newPassword");
      const confirmPassword = document.getElementById("confirmPassword");
      const passwordError = document.getElementById("passwordError");
      const confirmError = document.getElementById("confirmError");

      function validatePassword(password) {
        // Regex untuk validasi: min 1 huruf besar, kecil, angka, simbol
        const regex =
          /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{6,}$/;
        return regex.test(password);
      }

      form.addEventListener("submit", function (e) {
        let isValid = true;

        // Cek aturan password
        if (!validatePassword(newPassword.value)) {
          passwordError.style.display = "block";
          isValid = false;
        } else {
          passwordError.style.display = "none";
        }

        // Cek confirm password
        if (newPassword.value !== confirmPassword.value) {
          confirmError.style.display = "block";
          isValid = false;
        } else {
          confirmError.style.display = "none";
        }

        if (!isValid) {
          e.preventDefault(); // stop submit kalau error
        }
      });
    </script>
  </body>
</html>
