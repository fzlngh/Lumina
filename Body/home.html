<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina</title>
    <link rel="stylesheet" href="../Style/home.css" />
  </head>
  <body>
    <div class="main">
      <div class="navbar">
        <div>
          <img class="logo" src="../img/Logo.png" alt="Lumina.png" />
        </div>

        <div class="nav-bar">
          <ul type="none">
            <div class="dashboard">
              <img src="../img/Restaurant Location.png" alt="dashboard.png" />
              <li><a href="#">Dashboard</a></li>
            </div>

            <div class="item">
              <div class="food-order">
                <a href="#"
                  ><img
                    src="../img/Delivery Scooter.png"
                    alt="order-delivery.png"
                /></a>
                <li><a href="#">Food order</a></li>
              </div>

              <div class="order-history">
                <img
                  src="../img/24 Hour Food Delivery.png"
                  alt="order-history.png"
                />
                <li><a href="#">Order history</a></li>
              </div>

              <div class="settings">
                <img src="../img/weui_setting-filled.png" alt="" />
                <li><a href="#">Settings</a></li>
              </div>
            </div>
          </ul>
        </div>
      </div>

      <div class="hero">
        <div class="hero-item-1">
          <h2>What're craving today?</h2>

          <form class="search">
            <img src="../img/search.png" alt="search.png" />
            <input type="text" placeholder="What do you want eat today..." />
          </form>
        </div>

        <div class="display-item-2">
          <div class="text">
            <h2>Make Your Lunch</h2>
            <h2>Be Better</h2>
            <p>
              Lorem ipsum dolor sit amet, consectetur adipiscing elit,<br />
              sed do eiusmod tempor incididunt.
            </p>
          </div>

          <img
            src="../img/image-of-young-brunette-asian-woman-smiling-and-ho-2021-08-30-02-13-34-utc 1.png"
            alt="gambar-orang.png"
          />
        </div>

        <div class="display-item-3">
          <h5>Category</h5>

          <div class="view-all">
            <a href="#"><h5>View all</h5></a>
            <img src="../img/chevron-down.png" alt="panah.png" />
          </div>
        </div>

        <div class="display-item-4">
          <div class="beverage">
            <a href="#">
              <img src="../img/Coffee.png" alt="coffe.png" />
            </a>

            <a href="#">
              <h4>Beverage</h4>
            </a>
          </div>

          <div class="Food">
            <a href="#">
              <img src="../img/Burger.png" alt="burger.png" />
            </a>

            <a href="#">
              <h4>Food</h4>
            </a>
          </div>
        </div>

        <div class="display-item-5">
          <img src="../img/Group 40.jpg" alt="tangan.jpg" />
          <img src="../img/Group 41.jpg" alt="tangan.jpg" />
          <img src="../img/Group 42.jpg" alt="tangan.jpg" />
          <img src="../img/Group 43.jpg" alt="tangan.jpg" />
        </div>

        <div class="display-item-6">
          <h3>Food</h3>
        </div>
      </div>

      <div class="navbar-right">
        <div class="item-top">
          <h2>Hello, guest</h2>

          <img src="../img/Rectangle 5917.jpg" alt="profile.jpeg" />
        </div>

        <div class="item-bottom">
          <h4>Order Menu</h4>

          <p>there's nothing to order</p>
        </div>
        <hr />
      </div>
    </div>

</html>
