<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina Contact</title>
    <style>
      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background-color: #f9f9f9;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      .back-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        cursor: pointer;
        text-decoration: none;
        color: black;
      }

      .back-btn img {
        width: 30px;
        height: 30px;
      }

      .container {
        text-align: center;
        width: 100%;
        max-width: 400px;
      }

      .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }

      .logo img {
        width: 300px;
        height: 80px;
        margin-left: 60px;
      }


      form {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      label {
        font-size: 14px;
        font-weight: 500;
      }

      input,
      textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #bbb;
        border-radius: 3px;
        font-size: 14px;
      }

      textarea {
        resize: none;
        height: 80px;
      }

      button {
        width: 100%;
        margin-top: 15px;
        background-color: #ffc107;
        border: none;
        padding: 10px;
        border-radius: 3px;
        font-size: 16px;
        font-weight: 600;
        color: white;
        cursor: pointer;
      }

      button:hover {
        background-color: #ffb800;
      }
    </style>
  </head>
  <body>
    <a href="home.html" class="back-btn"
      ><img src="./img/ep_back.png" alt="back-btn"
    /></a>

    <div class="container">
      <div class="logo">
        <img src="./img/Logo.png" alt="Lumina Logo" />

      </div>

      <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
